<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPS 测试 - 点击速度测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    /* 时间选择 */
    .time-select {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .time-btn {
      padding: 10px 22px;
      border: 2px solid #555;
      border-radius: 30px;
      background: transparent;
      color: #ccc;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-btn.active, .time-btn:hover {
      border-color: #ffd200;
      color: #ffd200;
      background: rgba(255, 210, 0, 0.08);
    }

    /* 信息栏 */
    .info-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 28px;
    }

    .info-item {
      text-align: center;
    }

    .info-item .label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-item .value {
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
    }

    .info-item .value.time {
      color: #ffd200;
    }

    /* 点击按钮 */
    .click-area {
      width: 220px;
      height: 220px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f7971e, #ffd200);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      font-weight: 600;
      color: #1a1a2e;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s, box-shadow 0.08s;
      box-shadow: 0 0 40px rgba(255, 210, 0, 0.25);
    }

    .click-area:active {
      transform: scale(0.93);
      box-shadow: 0 0 20px rgba(255, 210, 0, 0.4);
    }

    .click-area.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* 结果 */
    .result {
      min-height: 80px;
      margin-bottom: 16px;
    }

    .result .cps {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .result .rank {
      font-size: 1.1rem;
      color: #aaa;
      margin-top: 4px;
    }

    .result .reset-hint {
      color: #666;
      font-size: 0.9rem;
    }

    /* 波纹动画 */
    .ripple {
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 210, 0, 0.3);
      transform: scale(0);
      animation: rippleAnim 0.4s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CPS 点击速度测试</h1>
    <p class="subtitle">在限定时间内尽可能快地点击圆圈</p>

    <div class="time-select">
      <button class="time-btn active" data-time="1">1 秒</button>
      <button class="time-btn" data-time="5">5 秒</button>
      <button class="time-btn" data-time="10">10 秒</button>
    </div>

    <div class="info-bar">
      <div class="info-item">
        <div class="label">时间</div>
        <div class="value time" id="timer">0.0s</div>
      </div>
      <div class="info-item">
        <div class="label">点击</div>
        <div class="value" id="clicks">0</div>
      </div>
    </div>

    <div class="click-area" id="clickBtn">点击开始</div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const clickBtn  = document.getElementById('clickBtn');
    const timerEl   = document.getElementById('timer');
    const clicksEl  = document.getElementById('clicks');
    const resultEl  = document.getElementById('result');
    const timeBtns  = document.querySelectorAll('.time-btn');

    let selectedTime = 1;
    let clickCount   = 0;
    let startTime    = null;
    let timerInterval = null;
    let isRunning    = false;

    // 选择时间
    timeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRunning) return;
        timeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTime = parseInt(btn.dataset.time);
        reset();
      });
    });

    // 点击事件
    clickBtn.addEventListener('click', (e) => {
      // 波纹效果
      createRipple(e.clientX, e.clientY);

      if (!isRunning) {
        // 第一次点击，开始计时
        start();
      }

      clickCount++;
      clicksEl.textContent = clickCount;
    });

    // 禁用右键菜单防止作弊提示
    clickBtn.addEventListener('contextmenu', e => e.preventDefault());

    function start() {
      isRunning = true;
      startTime = performance.now();
      resultEl.innerHTML = '<span class="reset-hint">疯狂点击！</span>';

      timerInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timerEl.textContent = elapsed.toFixed(1) + 's';

        if (elapsed >= selectedTime) {
          end();
        }
      }, 50);
    }

    function end() {
      isRunning = false;
      clearInterval(timerInterval);

      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1) + 's';

      const cps = (clickCount / elapsed).toFixed(2);
      const rank = getRank(parseFloat(cps));

      resultEl.innerHTML = `
        <div class="cps">${cps} CPS</div>
        <div class="rank">${rank}</div>
      `;

      clickBtn.textContent = '再来一次';
      clickBtn.classList.add('disabled');
      setTimeout(() => {
        clickBtn.classList.remove('disabled');
        clickBtn.onclick = () => reset();
      }, 600);
    }

    function reset() {
      clearInterval(timerInterval);
      isRunning  = false;
      clickCount = 0;
      startTime  = null;
      timerEl.textContent  = '0.0s';
      clicksEl.textContent = '0';
      resultEl.innerHTML   = '';
      clickBtn.textContent = '点击开始';
      clickBtn.onclick = null;
    }

    function getRank(cps) {
      if (cps >= 14) return '⚡ 传说级！超人类手速';
      if (cps >= 11) return '🔥 极快！电竞选手水平';
      if (cps >= 9)  return '💪 非常快！高手水准';
      if (cps >= 7)  return '👍 不错！高于平均水平';
      if (cps >= 5)  return '😊 正常水平';
      if (cps >= 3)  return '🐢 偏慢，再练练吧';
      return '🦥 太慢啦！加把劲';
    }

    function createRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      const size = 100;
      ripple.style.width  = size + 'px';
      ripple.style.height = size + 'px';
      ripple.style.left   = (x - size / 2) + 'px';
      ripple.style.top    = (y - size / 2) + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 400);
    }
  </script>
</body>
</html>
