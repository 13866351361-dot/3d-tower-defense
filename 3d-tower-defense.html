<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 塔防战争</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#111827;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;}

/* Loading */
#loading{position:fixed;inset:0;background:#111827;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:16px;z-index:999;}
#loading h1{font-size:36px;color:#ffd700;}
#loading p{color:#9ca3af;}
#loading .spinner{width:48px;height:48px;border:4px solid #374151;border-top:4px solid #ffd700;
  border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* HUD Top Bar */
#hud{position:fixed;top:0;left:0;right:0;height:52px;
  background:linear-gradient(180deg,rgba(17,24,39,.92) 0%,rgba(17,24,39,.85) 100%);
  border-bottom:2px solid #ffd700;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;z-index:100;
  box-shadow:0 4px 20px rgba(255,215,0,.25);}
#hud .stat{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;}
#hud .stat .icon{font-size:20px;}
#hud .stat .val{color:#ffd700;min-width:45px;}
#healthBar{width:110px;height:12px;background:#374151;border-radius:6px;overflow:hidden;border:1px solid #4b5563;}
#healthFill{height:100%;background:linear-gradient(90deg,#ef4444,#f87171);border-radius:6px;transition:width .3s;}
.waveInfo{font-size:14px;color:#9ca3af;}
.waveInfo span{color:#ffd700;font-weight:700;}

/* Controls */
#controls{position:fixed;top:60px;right:16px;display:flex;gap:8px;z-index:100;}
.ctrlBtn{padding:7px 14px;border:2px solid #ffd700;background:rgba(17,24,39,.88);
  color:#ffd700;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .2s;}
.ctrlBtn:hover{background:rgba(255,215,0,.2);transform:scale(1.05);}
.ctrlBtn.active{background:#ffd700;color:#111827;}

/* Tower Panel */
#towerPanel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;padding:12px 18px;z-index:100;
  background:linear-gradient(180deg,rgba(17,24,39,.92),rgba(17,24,39,.85));
  border:2px solid #ffd700;border-radius:14px;
  box-shadow:0 -4px 24px rgba(255,215,0,.15);}
.towerBtn{width:68px;height:68px;border:2px solid #4b5563;border-radius:10px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;transition:all .25s;
  background:rgba(30,30,50,.7);position:relative;}
.towerBtn:hover{border-color:#ffd700;transform:translateY(-4px);
  box-shadow:0 4px 16px rgba(255,215,0,.25);}
.towerBtn.selected{border-color:#ffd700;background:rgba(255,215,0,.12);
  box-shadow:0 0 16px rgba(255,215,0,.35);}
.towerBtn .tIcon{font-size:26px;}
.towerBtn .tCost{font-size:11px;color:#ffd700;}
.towerBtn .tName{font-size:9px;color:#9ca3af;}
.towerBtn.disabled{opacity:.35;cursor:not-allowed;}

/* Upgrade Panel */
#upgradePanel{position:fixed;right:16px;top:50%;transform:translateY(-50%);
  width:210px;padding:14px;z-index:100;display:none;
  background:linear-gradient(180deg,rgba(17,24,39,.95),rgba(17,24,39,.88));
  border:2px solid #ffd700;border-radius:14px;
  box-shadow:0 0 20px rgba(255,215,0,.15);}
#upgradePanel h3{color:#ffd700;margin-bottom:8px;font-size:15px;}
#upgradePanel .info{font-size:12px;color:#d1d5db;margin-bottom:5px;}
#upgradePanel .upgradeBtns{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.upgBtn{padding:8px;border:2px solid #4b5563;border-radius:8px;cursor:pointer;
  background:rgba(30,30,50,.7);color:#fff;font-size:12px;transition:all .2s;text-align:left;}
.upgBtn:hover{border-color:#ffd700;background:rgba(255,215,0,.08);}
.upgBtn .upgTitle{color:#ffd700;font-weight:700;font-size:12px;}
.upgBtn .upgDesc{color:#9ca3af;font-size:10px;margin-top:2px;}
.upgBtn .upgCost{color:#ffd700;font-size:11px;margin-top:3px;}
.sellBtn{padding:7px;border:2px solid #ef4444;border-radius:8px;cursor:pointer;
  background:rgba(239,68,68,.15);color:#f87171;font-size:12px;margin-top:8px;text-align:center;}
.sellBtn:hover{background:rgba(239,68,68,.3);}

/* Wave Start */
#waveStartBtn{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);
  padding:11px 32px;border:2px solid #ffd700;background:rgba(255,215,0,.12);
  color:#ffd700;font-size:17px;font-weight:700;border-radius:12px;cursor:pointer;
  z-index:100;transition:all .3s;letter-spacing:2px;
  box-shadow:0 0 18px rgba(255,215,0,.25);}
#waveStartBtn:hover{background:rgba(255,215,0,.25);transform:translateX(-50%) scale(1.06);}
#waveStartBtn.hidden{display:none;}

/* Game Over / Victory Overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;
  align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:18px;}
#overlay h1{font-size:44px;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.5);}
#overlay p{font-size:18px;color:#d1d5db;}
#overlay button{padding:12px 36px;font-size:17px;font-weight:700;border:2px solid #ffd700;
  background:rgba(255,215,0,.12);color:#ffd700;border-radius:12px;cursor:pointer;
  transition:all .3s;}
#overlay button:hover{background:rgba(255,215,0,.25);}

/* Speed control */
#speedCtrl{position:fixed;top:60px;left:16px;display:flex;gap:6px;z-index:100;}
.speedBtn{padding:5px 10px;border:1px solid #6b7280;background:rgba(17,24,39,.85);
  color:#9ca3af;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s;}
.speedBtn.active{border-color:#ffd700;color:#ffd700;background:rgba(255,215,0,.12);}

/* Level indicator */
#levelBanner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:40px;font-weight:900;color:#ffd700;z-index:150;display:none;
  text-shadow:0 0 40px rgba(255,215,0,.7),0 0 80px rgba(255,215,0,.3);
  letter-spacing:4px;pointer-events:none;}

@media(max-width:768px){
  #towerPanel{gap:6px;padding:8px 10px;}
  .towerBtn{width:52px;height:52px;}
  .towerBtn .tIcon{font-size:20px;}
  #upgradePanel{width:170px;}
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading">
  <div class="spinner"></div>
  <h1>3D 塔防战争</h1>
  <p>正在加载 Three.js 引擎...</p>
</div>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="stat"><span class="icon">&#10084;</span>
    <div id="healthBar"><div id="healthFill" style="width:100%"></div></div>
    <span class="val" id="healthVal">20</span>
  </div>
  <div class="stat"><span class="icon">&#128176;</span><span class="val" id="goldVal">200</span></div>
  <div class="stat"><span class="icon">&#11088;</span><span class="val" id="scoreVal">0</span></div>
  <div class="waveInfo">第 <span id="levelVal">1</span> 关 · 波次 <span id="waveVal">0</span>/<span id="waveMax">10</span></div>
</div>

<!-- Controls -->
<div id="controls">
  <button class="ctrlBtn" id="pauseBtn">|| 暂停</button>
  <button class="ctrlBtn" id="restartBtn">重来</button>
</div>

<!-- Speed -->
<div id="speedCtrl">
  <button class="speedBtn active" data-speed="1">1x</button>
  <button class="speedBtn" data-speed="2">2x</button>
  <button class="speedBtn" data-speed="3">3x</button>
</div>

<!-- Tower Selection -->
<div id="towerPanel">
  <div class="towerBtn" data-tower="arrow">
    <span class="tIcon">&#127993;</span><span class="tCost">$50</span><span class="tName">箭塔</span>
  </div>
  <div class="towerBtn" data-tower="cannon">
    <span class="tIcon">&#128163;</span><span class="tCost">$100</span><span class="tName">炮塔</span>
  </div>
  <div class="towerBtn" data-tower="ice">
    <span class="tIcon">&#10052;</span><span class="tCost">$75</span><span class="tName">冰塔</span>
  </div>
  <div class="towerBtn" data-tower="fire">
    <span class="tIcon">&#128293;</span><span class="tCost">$120</span><span class="tName">火塔</span>
  </div>
  <div class="towerBtn" data-tower="lightning">
    <span class="tIcon">&#9889;</span><span class="tCost">$150</span><span class="tName">雷塔</span>
  </div>
</div>

<button id="waveStartBtn">&#9654; 开始波次</button>

<div id="upgradePanel">
  <h3 id="upgTitle">箭塔 Lv.1</h3>
  <div class="info" id="upgInfo">伤害: 10 | 射程: 3</div>
  <div class="info" id="upgKills">击杀: 0</div>
  <div class="upgradeBtns" id="upgBtns"></div>
  <button class="sellBtn" id="sellBtn">出售 ($25)</button>
</div>

<div id="overlay">
  <h1 id="overlayTitle">游戏结束</h1>
  <p id="overlayMsg">最终得分: 0</p>
  <button id="overlayBtn">重新开始</button>
</div>

<div id="levelBanner"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

console.log('[TowerDefense] Three.js loaded successfully');

// Hide loading screen
document.getElementById('loading').style.display = 'none';

/* ========== CONSTANTS ========== */
const GRID_W = 20, GRID_H = 14;

const TOWER_DATA = {
  arrow: {
    name: '箭塔', icon: '\u{1F3F9}', cost: 50, damage: 12, range: 3.5, rate: 0.5,
    color: 0x44ff44, projColor: 0x88ff88, projSpeed: 12, splash: 0,
    upgrades: [
      { name: '疾射', desc: '攻速x2, 伤害-30%', cost: 80, rateMul: 0.5, dmgMul: 0.7 },
      { name: '狙击', desc: '射程+50%, 伤害+80%', cost: 100, rangeMul: 1.5, dmgMul: 1.8 }
    ]
  },
  cannon: {
    name: '炮塔', icon: '\u{1F4A3}', cost: 100, damage: 40, range: 3, rate: 1.5,
    color: 0xff4444, projColor: 0xff8844, projSpeed: 8, splash: 1.2,
    upgrades: [
      { name: '迫击炮', desc: '溅射范围+80%', cost: 120, splashMul: 1.8 },
      { name: '攻城', desc: '伤害+120%, 攻速-20%', cost: 140, dmgMul: 2.2, rateMul: 1.2 }
    ]
  },
  ice: {
    name: '冰塔', icon: '❄', cost: 75, damage: 8, range: 3, rate: 0.8,
    color: 0x44ddff, projColor: 0x88eeff, projSpeed: 10, splash: 0, slow: 0.5, slowDur: 2,
    upgrades: [
      { name: '冻结', desc: '减速70%, 持续3秒', cost: 90, slow: 0.7, slowDur: 3 },
      { name: '暴风雪', desc: '范围减速, 伤害+50%', cost: 110, splash: 1.5, dmgMul: 1.5, slow: 0.5 }
    ]
  },
  fire: {
    name: '火塔', icon: '\u{1F525}', cost: 120, damage: 6, range: 2.5, rate: 0.3,
    color: 0xff8800, projColor: 0xffaa44, projSpeed: 14, splash: 0, dot: 3, dotDur: 3,
    upgrades: [
      { name: '炼狱', desc: 'DOT翻倍, 范围DOT', cost: 130, dot: 6, dotDur: 4, splash: 1 },
      { name: '陨石', desc: '大范围高伤害', cost: 160, damage: 50, rate: 2.5, splash: 2, projSpeed: 6 }
    ]
  },
  lightning: {
    name: '雷塔', icon: '⚡', cost: 150, damage: 25, range: 4, rate: 0.7,
    color: 0xaa44ff, projColor: 0xcc88ff, projSpeed: 20, splash: 0, chain: 2,
    upgrades: [
      { name: '特斯拉', desc: '连锁+2目标', cost: 150, chain: 4 },
      { name: '风暴', desc: '伤害+100%, 攻速+30%', cost: 170, dmgMul: 2, rateMul: 0.7 }
    ]
  }
};

const ENEMY_TYPES = {
  grunt:   { name: '步兵',   hp: 60,  speed: 1.8, reward: 10, score: 10, color: 0xff4444, scale: 0.3 },
  runner:  { name: '疾行者', hp: 35,  speed: 3.5, reward: 8,  score: 15, color: 0xffaa00, scale: 0.25 },
  tank:    { name: '重装甲', hp: 250, speed: 1,   reward: 25, score: 30, color: 0x8888ff, scale: 0.45 },
  healer:  { name: '治疗者', hp: 80,  speed: 1.5, reward: 15, score: 20, color: 0x44ff88, scale: 0.3, heal: true },
  stealth: { name: '隐身者', hp: 50,  speed: 2.5, reward: 12, score: 25, color: 0xaaaaaa, scale: 0.28, stealth: true },
  boss:    { name: 'BOSS',   hp: 800, speed: 0.8, reward: 100,score: 100,color: 0xff0000, scale: 0.6 }
};

const LEVELS = [
  {
    name: '翡翠平原', fogColor: 0x4a6a4a, groundColor: 0x5a7a5a,
    waves: [
      [{ type: 'grunt', count: 8, interval: 1 }],
      [{ type: 'grunt', count: 10, interval: 0.8 }, { type: 'runner', count: 3, interval: 0.6 }],
      [{ type: 'grunt', count: 6, interval: 0.7 }, { type: 'runner', count: 6, interval: 0.5 }],
      [{ type: 'tank', count: 3, interval: 2 }, { type: 'grunt', count: 8, interval: 0.6 }],
      [{ type: 'runner', count: 10, interval: 0.4 }, { type: 'tank', count: 2, interval: 1.5 }]
    ]
  },
  {
    name: '熔岩裂谷', fogColor: 0x6a3a1a, groundColor: 0x7a4a2a,
    waves: [
      [{ type: 'grunt', count: 12, interval: 0.7 }, { type: 'runner', count: 5, interval: 0.5 }],
      [{ type: 'tank', count: 4, interval: 1.5 }, { type: 'grunt', count: 10, interval: 0.5 }],
      [{ type: 'healer', count: 3, interval: 1.5 }, { type: 'tank', count: 4, interval: 1.2 }],
      [{ type: 'stealth', count: 8, interval: 0.8 }, { type: 'runner', count: 8, interval: 0.4 }],
      [{ type: 'boss', count: 1, interval: 1 }, { type: 'grunt', count: 15, interval: 0.4 }]
    ]
  },
  {
    name: '暗影要塞', fogColor: 0x2a2a4a, groundColor: 0x3a3a5a,
    waves: [
      [{ type: 'stealth', count: 10, interval: 0.6 }, { type: 'tank', count: 4, interval: 1 }],
      [{ type: 'healer', count: 4, interval: 1 }, { type: 'tank', count: 6, interval: 1 }, { type: 'runner', count: 8, interval: 0.4 }],
      [{ type: 'runner', count: 15, interval: 0.3 }, { type: 'stealth', count: 10, interval: 0.5 }],
      [{ type: 'boss', count: 1, interval: 1 }, { type: 'healer', count: 3, interval: 1 }, { type: 'tank', count: 5, interval: 1 }],
      [{ type: 'boss', count: 2, interval: 3 }, { type: 'stealth', count: 12, interval: 0.4 }, { type: 'grunt', count: 20, interval: 0.3 }]
    ]
  }
];

// Path waypoints - enemies walk through these grid cells
const PATH_CELLS = [
  [0,7],[1,7],[2,7],[3,7],[3,6],[3,5],[3,4],[4,4],[5,4],[6,4],[7,4],
  [7,5],[7,6],[7,7],[7,8],[7,9],[7,10],[8,10],[9,10],[10,10],
  [10,9],[10,8],[10,7],[10,6],[10,5],[11,5],[12,5],[13,5],
  [13,6],[13,7],[13,8],[13,9],[13,10],[13,11],[14,11],[15,11],
  [16,11],[17,11],[17,10],[17,9],[17,8],[17,7],[17,6],[18,6],[19,6]
];

/* ========== GAME STATE ========== */
let scene, camera, renderer, controls, clock;
const game = {
  health: 20, maxHealth: 20, gold: 200, score: 0, level: 0, wave: 0,
  paused: false, gameOver: false, speed: 1,
  towers: [], enemies: [], projectiles: [], particles: [],
  selectedTower: null, selectedCell: null,
  waveActive: false, waveTimer: 0, waveSpawns: [],
  grid: []
};

/* ========== THREE.JS SETUP ========== */
function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(GRID_W / 2, 16, GRID_H + 8);
  camera.lookAt(GRID_W / 2, 0, GRID_H / 2);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('gameCanvas'),
    antialias: true
  });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.2;
  controls.minDistance = 8;
  controls.maxDistance = 30;
  controls.target.set(GRID_W / 2, 0, GRID_H / 2);

  clock = new THREE.Clock();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

/* ========== SCENE LIGHTING ========== */
function addSceneLights(levelData) {
  scene.add(new THREE.AmbientLight(0x808090, 0.7));

  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.4);
  dirLight.position.set(15, 20, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -20;
  dirLight.shadow.camera.right = 20;
  dirLight.shadow.camera.top = 20;
  dirLight.shadow.camera.bottom = -20;
  scene.add(dirLight);

  scene.add(new THREE.HemisphereLight(0x8899cc, 0x556633, 0.5));
}

/* ========== BUILD LEVEL ========== */
function buildLevel(lvl) {
  // Clear scene
  while (scene.children.length > 0) scene.remove(scene.children[0]);
  addSceneLights(lvl);
  scene.fog = new THREE.FogExp2(lvl.fogColor, 0.015);

  // Ground plane
  const groundGeo = new THREE.PlaneGeometry(GRID_W + 6, GRID_H + 6);
  const groundMat = new THREE.MeshStandardMaterial({ color: lvl.groundColor, roughness: 0.85 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(GRID_W / 2, -0.05, GRID_H / 2);
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid lines
  const gridH = new THREE.GridHelper(
    Math.max(GRID_W, GRID_H), Math.max(GRID_W, GRID_H), 0x555555, 0x3a3a3a
  );
  gridH.position.set(GRID_W / 2, 0.01, GRID_H / 2);
  scene.add(gridH);

  // Path tiles
  for (const [px, pz] of PATH_CELLS) {
    const geo = new THREE.BoxGeometry(0.95, 0.1, 0.95);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xb8956a, roughness: 0.6, metalness: 0.1
    });
    const tile = new THREE.Mesh(geo, mat);
    tile.position.set(px + 0.5, 0.05, pz + 0.5);
    tile.receiveShadow = true;
    scene.add(tile);
  }

  // Start/End markers
  const markers = [
    { pos: PATH_CELLS[0], color: 0x44ff44 },
    { pos: PATH_CELLS[PATH_CELLS.length - 1], color: 0xff4444 }
  ];
  for (const { pos, color } of markers) {
    const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: 0.6
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(pos[0] + 0.5, 0.15, pos[1] + 0.5);
    scene.add(m);

    const ringGeo = new THREE.TorusGeometry(0.45, 0.04, 8, 24);
    const ringMat = new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: 0.9
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(pos[0] + 0.5, 0.2, pos[1] + 0.5);
    scene.add(ring);
  }

  // Buildable cell tiles
  const pathSet = new Set(PATH_CELLS.map(c => c[0] + ',' + c[1]));
  const buildMat = new THREE.MeshStandardMaterial({
    color: 0x4a6a4a, transparent: true, opacity: 0.25, roughness: 0.9
  });
  for (let x = 0; x < GRID_W; x++) {
    for (let z = 0; z < GRID_H; z++) {
      if (!pathSet.has(x + ',' + z)) {
        const geo = new THREE.BoxGeometry(0.9, 0.02, 0.9);
        const tile = new THREE.Mesh(geo, buildMat.clone());
        tile.position.set(x + 0.5, 0.01, z + 0.5);
        tile.userData = { gx: x, gz: z, isBuildTile: true };
        scene.add(tile);
      }
    }
  }

  // Ambient floating particles
  const moteCount = 150;
  const motePos = new Float32Array(moteCount * 3);
  for (let i = 0; i < moteCount; i++) {
    motePos[i * 3] = Math.random() * GRID_W;
    motePos[i * 3 + 1] = Math.random() * 5 + 1;
    motePos[i * 3 + 2] = Math.random() * GRID_H;
  }
  const moteGeo = new THREE.BufferGeometry();
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  const moteMat = new THREE.PointsMaterial({
    color: 0xffd700, size: 0.1, transparent: true, opacity: 0.35
  });
  const motes = new THREE.Points(moteGeo, moteMat);
  motes.userData.isMotes = true;
  scene.add(motes);
}

/* ========== TOWER CREATION ========== */
function createTowerMesh(type, gx, gz) {
  const td = TOWER_DATA[type];
  const group = new THREE.Group();

  // Base
  const baseGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.15, 8);
  const baseMat = new THREE.MeshStandardMaterial({
    color: 0x666666, metalness: 0.5, roughness: 0.4
  });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.075;
  base.castShadow = true;
  group.add(base);

  // Body
  const bodyH = type === 'cannon' ? 0.7 : type === 'lightning' ? 0.9 : 0.6;
  const bodyGeo = new THREE.CylinderGeometry(0.2, 0.3, bodyH, 8);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: td.color, metalness: 0.3, roughness: 0.5,
    emissive: td.color, emissiveIntensity: 0.2
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.15 + bodyH / 2;
  body.castShadow = true;
  group.add(body);

  // Top decoration by type
  const topY = 0.15 + bodyH;
  if (type === 'arrow') {
    const topGeo = new THREE.ConeGeometry(0.25, 0.4, 8);
    const top = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({
      color: td.color, emissive: td.color, emissiveIntensity: 0.35
    }));
    top.position.y = topY + 0.2;
    top.castShadow = true;
    group.add(top);
  } else if (type === 'cannon') {
    const metalMat = new THREE.MeshStandardMaterial({
      color: 0x444444, metalness: 0.8, roughness: 0.2
    });
    const topGeo = new THREE.SphereGeometry(0.25, 8, 8);
    const top = new THREE.Mesh(topGeo, metalMat);
    top.position.y = topY + 0.15;
    top.castShadow = true;
    group.add(top);
    const barrelGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.5, 8);
    const barrel = new THREE.Mesh(barrelGeo, metalMat);
    barrel.rotation.z = Math.PI / 2;
    barrel.position.set(0.25, topY + 0.15, 0);
    group.add(barrel);
  } else if (type === 'ice') {
    const topGeo = new THREE.OctahedronGeometry(0.22, 0);
    const top = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({
      color: 0x88eeff, emissive: 0x44ddff, emissiveIntensity: 0.6,
      transparent: true, opacity: 0.8
    }));
    top.position.y = topY + 0.25;
    top.castShadow = true;
    group.add(top);
  } else if (type === 'fire') {
    const topGeo = new THREE.TorusGeometry(0.2, 0.06, 8, 12);
    const top = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({
      color: 0xff6600, emissive: 0xff4400, emissiveIntensity: 0.7
    }));
    top.position.y = topY + 0.2;
    top.rotation.x = Math.PI / 2;
    group.add(top);
  } else if (type === 'lightning') {
    const topGeo = new THREE.TetrahedronGeometry(0.25, 0);
    const top = new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({
      color: 0xcc66ff, emissive: 0xaa44ff, emissiveIntensity: 0.7
    }));
    top.position.y = topY + 0.25;
    top.castShadow = true;
    group.add(top);
  }

  // Range ring (hidden by default)
  const rangeGeo = new THREE.RingGeometry(td.range - 0.05, td.range, 32);
  const rangeMat = new THREE.MeshBasicMaterial({
    color: td.color, transparent: true, opacity: 0, side: THREE.DoubleSide
  });
  const rangeRing = new THREE.Mesh(rangeGeo, rangeMat);
  rangeRing.rotation.x = -Math.PI / 2;
  rangeRing.position.y = 0.05;
  rangeRing.userData.isRange = true;
  group.add(rangeRing);

  // Point light glow
  const pLight = new THREE.PointLight(td.color, 0.6, 3);
  pLight.position.y = 1;
  group.add(pLight);

  group.position.set(gx + 0.5, 0, gz + 0.5);
  return group;
}

function placeTower(gx, gz, type) {
  const td = TOWER_DATA[type];
  game.gold -= td.cost;
  const mesh = createTowerMesh(type, gx, gz);
  scene.add(mesh);

  const tower = {
    type, gx, gz, mesh, level: 1, kills: 0,
    damage: td.damage, range: td.range, rate: td.rate,
    splash: td.splash || 0, slow: td.slow || 0, slowDur: td.slowDur || 0,
    dot: td.dot || 0, dotDur: td.dotDur || 0, chain: td.chain || 0,
    cooldown: 0, upgraded: [false, false]
  };
  game.towers.push(tower);
  game.grid[gx][gz] = tower;
  spawnParticles(gx + 0.5, 0.3, gz + 0.5, td.color, 15, 0.5);
  updateHUD();
}

/* ========== ENEMY CREATION ========== */
function createEnemyMesh(type) {
  const ed = ENEMY_TYPES[type];
  const group = new THREE.Group();

  const geo = type === 'boss'
    ? new THREE.BoxGeometry(ed.scale * 2, ed.scale * 2, ed.scale * 2)
    : type === 'tank'
    ? new THREE.BoxGeometry(ed.scale * 1.6, ed.scale * 1.4, ed.scale * 1.6)
    : new THREE.SphereGeometry(ed.scale, 8, 8);

  const mat = new THREE.MeshStandardMaterial({
    color: ed.color, metalness: 0.2, roughness: 0.6,
    emissive: ed.color, emissiveIntensity: 0.25,
    transparent: !!ed.stealth, opacity: ed.stealth ? 0.3 : 1
  });
  const body = new THREE.Mesh(geo, mat);
  body.castShadow = !ed.stealth;
  group.add(body);

  // Eyes
  if (!ed.stealth) {
    for (const sx of [-0.08, 0.08]) {
      const eyeGeo = new THREE.SphereGeometry(0.05, 6, 6);
      const eye = new THREE.Mesh(eyeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
      eye.position.set(sx, ed.scale * 0.3, ed.scale * 0.8);
      group.add(eye);
      const pupilGeo = new THREE.SphereGeometry(0.025, 6, 6);
      const pupil = new THREE.Mesh(pupilGeo, new THREE.MeshBasicMaterial({ color: 0x111111 }));
      pupil.position.set(sx, ed.scale * 0.3, ed.scale * 0.9);
      group.add(pupil);
    }
  }

  // Health bar - bg
  const hbW = 0.6, hbH = 0.06;
  const hbBgGeo = new THREE.PlaneGeometry(hbW, hbH);
  const hbBg = new THREE.Mesh(hbBgGeo, new THREE.MeshBasicMaterial({
    color: 0x222222, side: THREE.DoubleSide
  }));
  hbBg.position.y = ed.scale * 1.5 + 0.2;
  group.add(hbBg);

  // Health bar - fill (origin at left edge)
  const hbFillGeo = new THREE.PlaneGeometry(hbW, hbH);
  hbFillGeo.translate(hbW / 2, 0, 0);
  const hbFill = new THREE.Mesh(hbFillGeo, new THREE.MeshBasicMaterial({
    color: 0x44ff44, side: THREE.DoubleSide
  }));
  hbFill.position.set(-hbW / 2, ed.scale * 1.5 + 0.2, 0.001);
  group.add(hbFill);

  group.userData.hbFill = hbFill;
  group.userData.hbBg = hbBg;

  // Healer aura
  if (ed.heal) {
    const auraGeo = new THREE.RingGeometry(0.5, 0.55, 24);
    const aura = new THREE.Mesh(auraGeo, new THREE.MeshBasicMaterial({
      color: 0x44ff88, transparent: true, opacity: 0.3, side: THREE.DoubleSide
    }));
    aura.rotation.x = -Math.PI / 2;
    aura.position.y = 0.05;
    group.add(aura);
    group.userData.aura = aura;
  }

  return group;
}

function spawnEnemy(type, hpMul) {
  const ed = ENEMY_TYPES[type];
  const mesh = createEnemyMesh(type);
  const startPos = PATH_CELLS[0];
  mesh.position.set(startPos[0] + 0.5, ed.scale + 0.1, startPos[1] + 0.5);
  scene.add(mesh);

  game.enemies.push({
    type, mesh, hp: ed.hp * hpMul, maxHp: ed.hp * hpMul,
    speed: ed.speed, reward: ed.reward, score: ed.score,
    pathIdx: 0, alive: true,
    slowMul: 1, slowTimer: 0, dotDmg: 0, dotTimer: 0,
    stealth: !!ed.stealth, healer: !!ed.heal
  });
}

/* ========== PROJECTILES ========== */
function fireProjectile(tower, target) {
  const td = TOWER_DATA[tower.type];
  const startPos = new THREE.Vector3(tower.gx + 0.5, 1, tower.gz + 0.5);

  const projGeo = new THREE.SphereGeometry(0.08, 6, 6);
  const projMat = new THREE.MeshBasicMaterial({ color: td.projColor });
  const projMesh = new THREE.Mesh(projGeo, projMat);
  projMesh.position.copy(startPos);
  scene.add(projMesh);

  game.projectiles.push({
    mesh: projMesh, target, tower,
    speed: td.projSpeed, damage: tower.damage,
    splash: tower.splash, slow: tower.slow, slowDur: tower.slowDur,
    dot: tower.dot, dotDur: tower.dotDur, chain: tower.chain,
    alive: true
  });
}

/* ========== PARTICLES ========== */
function spawnParticles(x, y, z, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.04 + Math.random() * 0.04, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    game.particles.push({
      mesh,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * speed,
        Math.random() * speed,
        (Math.random() - 0.5) * speed
      ),
      life: 1, decay: 0.8 + Math.random() * 0.5
    });
  }
}

function spawnExplosion(x, y, z, color, radius) {
  spawnParticles(x, y, z, color, 20, 2);
  // Shockwave ring
  const ringGeo = new THREE.TorusGeometry(0.1, 0.03, 8, 24);
  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.8
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, y, z);
  scene.add(ring);
  game.particles.push({
    mesh: ring, vel: new THREE.Vector3(), life: 1, decay: 1.5,
    isRing: true, targetRadius: radius
  });
}

function spawnLightning(start, end, color) {
  const points = [];
  const segs = 8;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const p = new THREE.Vector3().lerpVectors(start, end, t);
    if (i > 0 && i < segs) {
      p.x += (Math.random() - 0.5) * 0.3;
      p.y += (Math.random() - 0.5) * 0.3;
      p.z += (Math.random() - 0.5) * 0.3;
    }
    points.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  game.particles.push({ mesh: line, vel: new THREE.Vector3(), life: 1, decay: 3 });
}

/* ========== GAME UPDATE LOGIC ========== */
function updateEnemies(dt) {
  for (const e of game.enemies) {
    if (!e.alive) continue;

    // Slow effect
    if (e.slowTimer > 0) {
      e.slowTimer -= dt;
      if (e.slowTimer <= 0) e.slowMul = 1;
    }

    // DOT effect
    if (e.dotTimer > 0) {
      e.dotTimer -= dt;
      e.hp -= e.dotDmg * dt;
      if (e.hp <= 0) { killEnemy(e); continue; }
    }

    // Healer aura
    if (e.healer) {
      for (const other of game.enemies) {
        if (!other.alive || other === e) continue;
        const dx = e.mesh.position.x - other.mesh.position.x;
        const dz = e.mesh.position.z - other.mesh.position.z;
        if (Math.sqrt(dx * dx + dz * dz) < 2) {
          other.hp = Math.min(other.maxHp, other.hp + 15 * dt);
          updateEnemyHB(other);
        }
      }
    }

    // Movement along path
    const spd = e.speed * e.slowMul * dt;
    if (e.pathIdx < PATH_CELLS.length - 1) {
      const nxt = PATH_CELLS[e.pathIdx + 1];
      const tx = nxt[0] + 0.5, tz = nxt[1] + 0.5;
      const dx = tx - e.mesh.position.x;
      const dz = tz - e.mesh.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < spd) {
        e.mesh.position.x = tx;
        e.mesh.position.z = tz;
        e.pathIdx++;
      } else {
        e.mesh.position.x += (dx / dist) * spd;
        e.mesh.position.z += (dz / dist) * spd;
      }
      e.mesh.rotation.y = Math.atan2(dx, dz);
    } else {
      // Reached the end
      game.health--;
      e.alive = false;
      scene.remove(e.mesh);
      spawnParticles(e.mesh.position.x, e.mesh.position.y, e.mesh.position.z, 0xff0000, 10, 1);
      if (game.health <= 0) gameOver();
      updateHUD();
    }

    // Billboard health bars
    if (e.mesh.userData.hbBg) {
      e.mesh.userData.hbBg.lookAt(camera.position);
      e.mesh.userData.hbFill.lookAt(camera.position);
    }
  }
  game.enemies = game.enemies.filter(e => e.alive);
}

function updateEnemyHB(e) {
  const pct = Math.max(0, e.hp / e.maxHp);
  e.mesh.userData.hbFill.scale.x = pct;
  const c = pct > 0.5 ? 0x44ff44 : pct > 0.25 ? 0xffaa00 : 0xff4444;
  e.mesh.userData.hbFill.material.color.setHex(c);
}

function killEnemy(e) {
  e.alive = false;
  game.gold += e.reward;
  game.score += e.score;
  const pos = e.mesh.position.clone();
  scene.remove(e.mesh);
  spawnExplosion(pos.x, pos.y, pos.z, ENEMY_TYPES[e.type].color, 0.6);
  updateHUD();
}

function damageEnemy(enemy, dmg, proj) {
  enemy.hp -= dmg;
  updateEnemyHB(enemy);
  if (enemy.hp <= 0) {
    killEnemy(enemy);
    if (proj) proj.tower.kills++;
  } else {
    // Hit flash
    const body = enemy.mesh.children[0];
    if (body) {
      const orig = body.material.emissiveIntensity;
      body.material.emissiveIntensity = 1;
      setTimeout(() => { if (body.material) body.material.emissiveIntensity = orig; }, 100);
    }
  }
}

function updateTowers(dt) {
  const time = Date.now() * 0.001;
  for (const t of game.towers) {
    t.cooldown -= dt;

    // Animate top
    const top = t.mesh.children[2];
    if (top) {
      if (t.type === 'lightning' || t.type === 'ice') top.rotation.y += dt * 2;
      if (t.type === 'fire') top.rotation.z += dt * 3;
    }

    // Show range ring for selected tower
    const range = t.mesh.children.find(c => c.userData && c.userData.isRange);
    if (range) {
      const isSelected = game.selectedCell === t;
      range.material.opacity = isSelected ? 0.15 + Math.sin(time * 3) * 0.05 : 0;
    }

    if (t.cooldown > 0 || game.enemies.length === 0) continue;

    // Find best target
    let best = null, bestDist = Infinity;
    for (const e of game.enemies) {
      if (!e.alive) continue;
      // Stealth detection: only lightning towers + close range for others
      if (e.stealth && t.type !== 'lightning') {
        const dx = e.mesh.position.x - (t.gx + 0.5);
        const dz = e.mesh.position.z - (t.gz + 0.5);
        if (Math.sqrt(dx * dx + dz * dz) > 1.5) continue;
      }
      const dx = e.mesh.position.x - (t.gx + 0.5);
      const dz = e.mesh.position.z - (t.gz + 0.5);
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist <= t.range && dist < bestDist) {
        best = e;
        bestDist = dist;
      }
    }

    if (best) {
      t.cooldown = t.rate;
      fireProjectile(t, best);
      // Recoil
      t.mesh.position.y = -0.05;
      setTimeout(() => { if (t.mesh) t.mesh.position.y = 0; }, 100);
    }
  }
}

function updateProjectiles(dt) {
  for (const p of game.projectiles) {
    if (!p.alive) continue;
    if (!p.target || !p.target.alive) {
      p.alive = false;
      scene.remove(p.mesh);
      continue;
    }

    const target = p.target.mesh.position.clone();
    target.y += 0.3;
    const dir = target.clone().sub(p.mesh.position);
    const dist = dir.length();

    if (dist < 0.3) {
      // Hit
      p.alive = false;
      scene.remove(p.mesh);
      const td = TOWER_DATA[p.tower.type];

      if (p.splash > 0) {
        // Splash damage
        for (const e of game.enemies) {
          if (!e.alive) continue;
          const d = e.mesh.position.distanceTo(p.target.mesh.position);
          if (d <= p.splash) {
            damageEnemy(e, p.damage * (1 - d / p.splash * 0.5), p);
          }
        }
        spawnExplosion(target.x, target.y, target.z, td.projColor, p.splash);
      } else {
        damageEnemy(p.target, p.damage, p);
        spawnParticles(target.x, target.y, target.z, td.projColor, 6, 0.5);
      }

      // Chain lightning
      if (p.chain > 0) {
        let lastPos = p.target.mesh.position.clone();
        const chained = new Set([p.target]);
        for (let c = 0; c < p.chain; c++) {
          let closest = null, closestD = Infinity;
          for (const e of game.enemies) {
            if (!e.alive || chained.has(e)) continue;
            const d = e.mesh.position.distanceTo(lastPos);
            if (d < 3 && d < closestD) { closest = e; closestD = d; }
          }
          if (closest) {
            spawnLightning(lastPos, closest.mesh.position, td.projColor);
            damageEnemy(closest, p.damage * 0.6, p);
            chained.add(closest);
            lastPos = closest.mesh.position.clone();
          }
        }
      }

      // Apply DOT
      if (p.dot > 0 && p.dotDur > 0) {
        const targets = p.splash > 0
          ? game.enemies.filter(e => e.alive && e.mesh.position.distanceTo(p.target.mesh.position) <= p.splash)
          : [p.target];
        for (const e of targets) {
          if (e && e.alive) { e.dotDmg = p.dot; e.dotTimer = p.dotDur; }
        }
      }

      // Apply slow
      if (p.slow > 0) {
        const targets = p.splash > 0
          ? game.enemies.filter(e => e.alive && e.mesh.position.distanceTo(p.target.mesh.position) <= p.splash)
          : [p.target];
        for (const e of targets) {
          if (e && e.alive) { e.slowMul = 1 - p.slow; e.slowTimer = p.slowDur; }
        }
      }
    } else {
      dir.normalize().multiplyScalar(p.speed * dt);
      p.mesh.position.add(dir);
    }
  }
  game.projectiles = game.projectiles.filter(p => p.alive);
}

function updateParticles(dt) {
  for (const p of game.particles) {
    p.life -= dt * p.decay;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.dead = true;
      continue;
    }
    if (p.isRing) {
      const s = 1 + (1 - p.life) * p.targetRadius * 5;
      p.mesh.scale.set(s, s, s);
      p.mesh.material.opacity = p.life * 0.5;
    } else {
      p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
      p.vel.y -= dt * 3;
      p.mesh.material.opacity = p.life;
      p.mesh.scale.setScalar(p.life);
    }
  }
  game.particles = game.particles.filter(p => !p.dead);
}

function updateWaves(dt) {
  if (!game.waveActive) return;
  game.waveTimer -= dt;

  if (game.waveTimer <= 0 && game.waveSpawns.length > 0) {
    const spawn = game.waveSpawns.shift();
    game.waveTimer = spawn.interval;
    const hpMul = 1 + game.level * 0.3 + game.wave * 0.1;
    spawnEnemy(spawn.type, hpMul);
  }

  if (game.waveSpawns.length === 0 && game.enemies.length === 0) {
    game.waveActive = false;
    game.wave++;
    if (game.wave >= LEVELS[game.level].waves.length) {
      game.level++;
      game.wave = 0;
      if (game.level >= LEVELS.length) {
        victory();
        return;
      }
      showLevelBanner();
      buildLevel(LEVELS[game.level]);
      rebuildTowers();
    }
    document.getElementById('waveStartBtn').classList.remove('hidden');
    updateHUD();
  }
}

function rebuildTowers() {
  const oldTowers = [...game.towers];
  game.towers = [];
  game.grid = [];
  initGrid();
  for (const t of oldTowers) {
    const mesh = createTowerMesh(t.type, t.gx, t.gz);
    scene.add(mesh);
    const nt = { ...t, mesh, cooldown: 0 };
    game.towers.push(nt);
    game.grid[t.gx][t.gz] = nt;
    // Reapply upgrade visuals
    const top = mesh.children[2];
    if (top && nt.level > 1) {
      top.material.emissiveIntensity = 0.5 + nt.level * 0.15;
      top.scale.setScalar(1 + nt.level * 0.1);
    }
  }
}

function updateMotes() {
  for (const c of scene.children) {
    if (c.userData && c.userData.isMotes) {
      const pos = c.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.array[i * 3 + 1] += Math.sin(Date.now() * 0.001 + i) * 0.002;
        if (pos.array[i * 3 + 1] > 6) pos.array[i * 3 + 1] = 1;
      }
      pos.needsUpdate = true;
    }
  }
}

/* ========== WAVE START ========== */
function startWave() {
  console.log('[TowerDefense] startWave called. waveActive:', game.waveActive, 'gameOver:', game.gameOver, 'wave:', game.wave, 'level:', game.level);
  if (game.waveActive || game.gameOver) return;

  const lvl = LEVELS[game.level];
  if (!lvl || game.wave >= lvl.waves.length) {
    console.warn('[TowerDefense] No more waves. level:', game.level, 'wave:', game.wave);
    return;
  }

  const waveData = lvl.waves[game.wave];
  game.waveSpawns = [];
  for (const group of waveData) {
    for (let i = 0; i < group.count; i++) {
      game.waveSpawns.push({ type: group.type, interval: group.interval });
    }
  }
  // Shuffle spawn order
  for (let i = game.waveSpawns.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [game.waveSpawns[i], game.waveSpawns[j]] = [game.waveSpawns[j], game.waveSpawns[i]];
  }

  game.waveActive = true;
  game.waveTimer = 0.5;
  document.getElementById('waveStartBtn').classList.add('hidden');
  updateHUD();
  console.log('[TowerDefense] Wave started with', game.waveSpawns.length, 'enemies');
}

/* ========== TOWER SELECTION & UPGRADES ========== */
function selectTower(type) {
  if (game.gameOver) return;
  if (game.selectedTower === type) {
    game.selectedTower = null;
    document.querySelectorAll('.towerBtn').forEach(b => b.classList.remove('selected'));
    return;
  }
  const td = TOWER_DATA[type];
  if (game.gold < td.cost) return;
  game.selectedTower = type;
  game.selectedCell = null;
  hideUpgradePanel();
  document.querySelectorAll('.towerBtn').forEach(b => {
    b.classList.toggle('selected', b.dataset.tower === type);
  });
}

function showUpgradePanel(tower) {
  game.selectedCell = tower;
  game.selectedTower = null;
  document.querySelectorAll('.towerBtn').forEach(b => b.classList.remove('selected'));

  const td = TOWER_DATA[tower.type];
  const panel = document.getElementById('upgradePanel');
  panel.style.display = 'block';
  document.getElementById('upgTitle').textContent = `${td.name} Lv.${tower.level}`;
  document.getElementById('upgInfo').textContent =
    `伤害:${Math.round(tower.damage)} | 射程:${tower.range.toFixed(1)} | 攻速:${tower.rate.toFixed(2)}s`;
  document.getElementById('upgKills').textContent = `击杀: ${tower.kills}`;
  document.getElementById('sellBtn').textContent = `出售 ($${Math.round(td.cost * 0.6)})`;

  const btns = document.getElementById('upgBtns');
  btns.innerHTML = '';
  td.upgrades.forEach((upg, i) => {
    if (tower.upgraded[i]) return;
    const btn = document.createElement('div');
    btn.className = 'upgBtn';
    btn.innerHTML = `<div class="upgTitle">${upg.name}</div>
      <div class="upgDesc">${upg.desc}</div>
      <div class="upgCost">$${upg.cost}</div>`;
    btn.addEventListener('click', () => upgradeTower(tower, i));
    if (game.gold < upg.cost) btn.style.opacity = '0.5';
    btns.appendChild(btn);
  });
}

function hideUpgradePanel() {
  document.getElementById('upgradePanel').style.display = 'none';
  game.selectedCell = null;
}

function upgradeTower(tower, idx) {
  const td = TOWER_DATA[tower.type];
  const upg = td.upgrades[idx];
  if (game.gold < upg.cost || tower.upgraded[idx]) return;
  game.gold -= upg.cost;
  tower.upgraded[idx] = true;
  tower.level++;

  if (upg.dmgMul) tower.damage *= upg.dmgMul;
  if (upg.rangeMul) tower.range *= upg.rangeMul;
  if (upg.rateMul) tower.rate *= upg.rateMul;
  if (upg.splashMul) tower.splash *= upg.splashMul;
  if (upg.splash !== undefined) tower.splash = Math.max(tower.splash, upg.splash);
  if (upg.slow !== undefined) tower.slow = upg.slow;
  if (upg.slowDur !== undefined) tower.slowDur = upg.slowDur;
  if (upg.dot !== undefined) tower.dot = upg.dot;
  if (upg.dotDur !== undefined) tower.dotDur = upg.dotDur;
  if (upg.chain !== undefined) tower.chain = upg.chain;
  if (upg.damage !== undefined) tower.damage = upg.damage;
  if (upg.rate !== undefined) tower.rate = upg.rate;

  // Upgrade visual
  const top = tower.mesh.children[2];
  if (top) {
    top.material.emissiveIntensity = 0.5 + tower.level * 0.15;
    top.scale.setScalar(1 + tower.level * 0.1);
  }
  spawnParticles(tower.gx + 0.5, 1, tower.gz + 0.5, 0xffd700, 20, 1);
  showUpgradePanel(tower);
  updateHUD();
}

function sellTower() {
  if (!game.selectedCell) return;
  const t = game.selectedCell;
  const td = TOWER_DATA[t.type];
  game.gold += Math.round(td.cost * 0.6);
  scene.remove(t.mesh);
  game.grid[t.gx][t.gz] = null;
  game.towers = game.towers.filter(tw => tw !== t);
  hideUpgradePanel();
  spawnParticles(t.gx + 0.5, 0.5, t.gz + 0.5, 0xffd700, 15, 0.8);
  updateHUD();
}

/* ========== CLICK HANDLING ========== */
function onCanvasClick(e) {
  if (game.gameOver || game.paused) return;

  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check existing towers first
  for (const t of game.towers) {
    const hits = raycaster.intersectObject(t.mesh, true);
    if (hits.length > 0) {
      showUpgradePanel(t);
      return;
    }
  }

  // Check build tiles
  const buildTiles = scene.children.filter(c => c.userData && c.userData.isBuildTile);
  const hits = raycaster.intersectObjects(buildTiles);
  if (hits.length > 0 && game.selectedTower) {
    const { gx, gz } = hits[0].object.userData;
    if (!game.grid[gx][gz]) {
      const td = TOWER_DATA[game.selectedTower];
      if (game.gold >= td.cost) placeTower(gx, gz, game.selectedTower);
    }
  } else if (hits.length === 0) {
    hideUpgradePanel();
  }
}

/* ========== HUD ========== */
function updateHUD() {
  document.getElementById('healthVal').textContent = game.health;
  document.getElementById('healthFill').style.width = (game.health / game.maxHealth * 100) + '%';
  document.getElementById('goldVal').textContent = game.gold;
  document.getElementById('scoreVal').textContent = game.score;
  document.getElementById('levelVal').textContent = game.level + 1;
  document.getElementById('waveVal').textContent = game.wave;
  document.getElementById('waveMax').textContent = LEVELS[game.level] ? LEVELS[game.level].waves.length : 0;

  document.querySelectorAll('.towerBtn').forEach(b => {
    const cost = TOWER_DATA[b.dataset.tower].cost;
    b.classList.toggle('disabled', game.gold < cost);
  });
}

/* ========== SPEED / PAUSE ========== */
function togglePause() {
  game.paused = !game.paused;
  document.getElementById('pauseBtn').textContent = game.paused ? '> 继续' : '|| 暂停';
  document.getElementById('pauseBtn').classList.toggle('active', game.paused);
}

function setSpeed(s) {
  game.speed = s;
  document.querySelectorAll('.speedBtn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.speed) === s);
  });
}

/* ========== GAME OVER / VICTORY ========== */
function gameOver() {
  game.gameOver = true;
  document.getElementById('overlayTitle').textContent = '游戏结束';
  document.getElementById('overlayMsg').textContent = `最终得分: ${game.score}`;
  document.getElementById('overlay').style.display = 'flex';
}

function victory() {
  game.gameOver = true;
  document.getElementById('overlayTitle').textContent = '胜利!';
  document.getElementById('overlayMsg').textContent = `最终得分: ${game.score} · 全部通关!`;
  document.getElementById('overlay').style.display = 'flex';
}

function restartGame() {
  game.towers.forEach(t => scene.remove(t.mesh));
  game.enemies.forEach(e => scene.remove(e.mesh));
  game.projectiles.forEach(p => scene.remove(p.mesh));
  game.particles.forEach(p => scene.remove(p.mesh));

  Object.assign(game, {
    health: 20, maxHealth: 20, gold: 200, score: 0, level: 0, wave: 0,
    paused: false, gameOver: false, speed: 1,
    towers: [], enemies: [], projectiles: [], particles: [],
    selectedTower: null, selectedCell: null,
    waveActive: false, waveTimer: 0, waveSpawns: [], grid: []
  });
  initGrid();
  buildLevel(LEVELS[0]);
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('waveStartBtn').classList.remove('hidden');
  document.getElementById('pauseBtn').textContent = '|| 暂停';
  document.getElementById('pauseBtn').classList.remove('active');
  hideUpgradePanel();
  setSpeed(1);
  updateHUD();
  showLevelBanner();
}

function showLevelBanner() {
  const banner = document.getElementById('levelBanner');
  banner.textContent = `第 ${game.level + 1} 关 · ${LEVELS[game.level].name}`;
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 2500);
}

/* ========== INIT GRID ========== */
function initGrid() {
  game.grid = [];
  const pathSet = new Set(PATH_CELLS.map(c => c[0] + ',' + c[1]));
  for (let x = 0; x < GRID_W; x++) {
    game.grid[x] = [];
    for (let z = 0; z < GRID_H; z++) {
      game.grid[x][z] = pathSet.has(x + ',' + z) ? 'path' : null;
    }
  }
}

/* ========== RAYCASTING ========== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredTile = null;

/* ========== MAIN LOOP ========== */
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (!game.paused && !game.gameOver) {
    const dt = Math.min(clock.getDelta(), 0.05) * game.speed;
    updateEnemies(dt);
    updateTowers(dt);
    updateProjectiles(dt);
    updateParticles(dt);
    updateWaves(dt);
    updateMotes();
  } else {
    clock.getDelta(); // keep clock ticking
    updateParticles(0.016);
  }

  renderer.render(scene, camera);
}

/* ========== EVENT BINDING ========== */
function bindEvents() {
  // Canvas click
  renderer.domElement.addEventListener('click', onCanvasClick);
  renderer.domElement.addEventListener('contextmenu', e => {
    e.preventDefault();
    game.selectedTower = null;
    document.querySelectorAll('.towerBtn').forEach(b => b.classList.remove('selected'));
    hideUpgradePanel();
  });

  // Hover highlight
  renderer.domElement.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const buildTiles = scene.children.filter(c => c.userData && c.userData.isBuildTile);
    const hits = raycaster.intersectObjects(buildTiles);

    // Reset previous hover
    if (hoveredTile && hoveredTile.material) {
      hoveredTile.material.color.setHex(0x4a6a4a);
      hoveredTile.material.opacity = 0.25;
    }

    hoveredTile = hits.length > 0 ? hits[0].object : null;

    if (hoveredTile && hoveredTile.material && game.selectedTower) {
      const td = TOWER_DATA[game.selectedTower];
      const canBuild = !game.grid[hoveredTile.userData.gx][hoveredTile.userData.gz] && game.gold >= td.cost;
      hoveredTile.material.color.setHex(canBuild ? 0x44ff44 : 0xff4444);
      hoveredTile.material.opacity = 0.5;
    }
    renderer.domElement.style.cursor = hoveredTile && game.selectedTower ? 'crosshair' : 'default';
  });

  // UI buttons
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', restartGame);
  document.getElementById('waveStartBtn').addEventListener('click', startWave);
  document.getElementById('sellBtn').addEventListener('click', sellTower);
  document.getElementById('overlayBtn').addEventListener('click', restartGame);

  // Speed buttons
  document.querySelectorAll('.speedBtn').forEach(b => {
    b.addEventListener('click', () => setSpeed(parseInt(b.dataset.speed)));
  });

  // Tower buttons
  document.querySelectorAll('.towerBtn').forEach(b => {
    b.addEventListener('click', () => selectTower(b.dataset.tower));
  });
}

/* ========== START ========== */
try {
  initThree();
  initGrid();
  buildLevel(LEVELS[0]);
  bindEvents();
  showLevelBanner();
  updateHUD();
  animate();
  console.log('[TowerDefense] Game initialized successfully');
} catch (err) {
  console.error('[TowerDefense] Initialization error:', err);
  const loadEl = document.getElementById('loading');
  if (loadEl) {
    loadEl.querySelector('p').textContent = '加载失败: ' + err.message;
    loadEl.querySelector('.spinner').style.display = 'none';
  }
}
</script>
</body>
